<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5FA8A0"/>
    </marker>
  </defs>
  <g id="nodes">
    <!-- 1 -->
    <rect x="10" y="60" width="160" height="64" rx="12" fill="#5FA8A0"/>
    <text x="90" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Speakers → room</text>
    <text x="90" y="108" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9">your music, loud</text>
    <text x="90" y="150" text-anchor="middle" font-size="12" fill="#768390">the mic hears the song too</text>
    <!-- 2 -->
    <rect x="206" y="60" width="160" height="64" rx="12" fill="#5FA8A0"/>
    <text x="286" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Echo cancellation</text>
    <text x="286" y="108" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9">Apple voice-processing I/O</text>
    <text x="286" y="150" text-anchor="middle" font-size="12" fill="#768390">the Mac's own output: −25 dB</text>
    <text x="286" y="168" text-anchor="middle" font-size="12" fill="#768390">nothing is stored</text>
    <!-- 3 -->
    <rect x="402" y="60" width="160" height="64" rx="12" fill="#FACD46"/>
    <text x="482" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#2E2E32">Is that a person?</text>
    <text x="482" y="108" text-anchor="middle" font-size="12" fill="#2E2E32" opacity="0.85">classifier + level gate</text>
    <text x="482" y="150" text-anchor="middle" font-size="12" fill="#768390">"speech" label AND loud enough</text>
    <text x="482" y="168" text-anchor="middle" font-size="12" fill="#768390">(or Apple's talker detector)</text>
    <!-- 4 -->
    <rect x="598" y="60" width="160" height="64" rx="12" fill="#5FA8A0"/>
    <text x="678" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Debounce + hold</text>
    <text x="678" y="108" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.9">≈1 s to act · 4 s quiet to release</text>
    <text x="678" y="150" text-anchor="middle" font-size="12" fill="#768390">no flinching at a cough</text>
    <!-- 5 -->
    <rect x="794" y="60" width="156" height="64" rx="12" fill="#5FA8A0"/>
    <text x="872" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Fade the volume</text>
    <text x="872" y="108" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9">Core Audio, any player</text>
    <text x="872" y="150" text-anchor="middle" font-size="12" fill="#768390">down to 25 %, back up after</text>
  </g>
  <g id="arrows" stroke="#5FA8A0" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="172" y1="92" x2="203" y2="92"/>
    <line x1="368" y1="92" x2="399" y2="92"/>
    <line x1="564" y1="92" x2="595" y2="92"/>
    <line x1="760" y1="92" x2="791" y2="92"/>
  </g>
  <text x="480" y="30" text-anchor="middle" font-size="13" fill="#768390">everything runs on the Mac · no recordings · no network</text>
</svg>
